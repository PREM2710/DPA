version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: crm_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: premprem
      MYSQL_DATABASE: crm_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: crm_web
    depends_on:
      - db
    ports:
      - "8089:80"
    volumes:
      - ./src:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: premprem
      MYSQL_DATABASE: crm_db

volumes:
  db_data:
